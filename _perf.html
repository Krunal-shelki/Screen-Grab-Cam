<!doctype html>
<html><head><meta charset="utf-8"><title>perf</title>
<style>body{background:#111;color:#0f0;font:12px monospace;white-space:pre-wrap}</style>
</head><body>
<pre id="out">starting…</pre>
<script>
const out = document.getElementById('out');
const log = (s) => { out.textContent += '\n' + s; };
window.onerror = (m) => log('ERROR ' + m);

const t0 = performance.now();
const s = document.createElement('script');
s.src = 'https://docs.opencv.org/4.10.0/opencv.js';
s.async = true;
s.onload = () => {
  log('script onload ' + Math.round(performance.now() - t0) + 'ms');
  const wait = setInterval(() => {
    if (window.cv && window.cv.Mat) {
      clearInterval(wait);
      log('cv ready ' + Math.round(performance.now() - t0) + 'ms');
      setTimeout(run, 50);
    }
  }, 100);
};
s.onerror = () => log('script failed');
document.head.appendChild(s);

function time(label, fn) {
  const a = performance.now();
  try { fn(); } catch (e) { log(label + ' ERROR ' + e); return; }
  log(label + ' ' + (performance.now() - a).toFixed(1) + 'ms');
}

function run() {
  const cv = window.cv;
  const det = document.createElement('canvas');
  det.width = 480; det.height = 270;
  const dctx = det.getContext('2d', { willReadFrequently: true });
  dctx.fillStyle = '#334155'; dctx.fillRect(0, 0, 480, 270);
  dctx.fillStyle = '#05080c'; dctx.fillRect(90, 55, 300, 160);
  dctx.fillStyle = '#0f766e'; dctx.fillRect(90, 55, 300, 24);
  dctx.fillStyle = '#22d3ee'; dctx.fillRect(120, 130, 40, 60);
  dctx.fillStyle = '#2dd4bf'; dctx.fillRect(180, 110, 40, 80);
  dctx.fillStyle = '#e2e8f0'; dctx.fillRect(240, 90, 40, 100);

  let img;
  time('getImageData 480', () => { img = dctx.getImageData(0, 0, 480, 270); });
  const rgba = new cv.Mat(270, 480, cv.CV_8UC4);
  const gray = new cv.Mat(270, 480, cv.CV_8UC1);
  const blur = new cv.Mat(270, 480, cv.CV_8UC1);
  const edges = new cv.Mat(270, 480, cv.CV_8UC1);
  const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
  rgba.data.set(img.data);

  time('cvtColor', () => cv.cvtColor(rgba, gray, cv.COLOR_RGBA2GRAY));
  time('blur', () => cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT));
  time('canny', () => cv.Canny(blur, edges, 50, 140, 3, false));
  time('dilate', () => cv.dilate(edges, edges, kernel, new cv.Point(-1, -1), 1));

  time('findContours', () => {
    const contours = new cv.MatVector();
    const hier = new cv.Mat();
    cv.findContours(edges, contours, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
    log('contours=' + contours.size());
    let big = 0, quads = 0;
    for (let i = 0; i < contours.size(); i++) {
      const c = contours.get(i);
      const a = cv.contourArea(c);
      if (a > 480 * 270 * 0.012) {
        big++;
        const peri = cv.arcLength(c, true);
        const ap = new cv.Mat();
        cv.approxPolyDP(c, ap, 0.02 * peri, true);
        if (ap.rows === 4 && cv.isContourConvex(ap)) quads++;
        ap.delete();
      }
      c.delete();
    }
    log('big=' + big + ' quads=' + quads);
    hier.delete();
    contours.delete();
  });

  const big = document.createElement('canvas');
  big.width = 1280; big.height = 720;
  const bctx = big.getContext('2d', { willReadFrequently: true });
  bctx.fillStyle = '#334155'; bctx.fillRect(0, 0, 1280, 720);
  bctx.fillStyle = '#05080c'; bctx.fillRect(240, 150, 800, 420);
  bctx.fillStyle = '#22d3ee'; bctx.fillRect(320, 300, 120, 180);

  let bimg;
  time('getImageData 1280', () => { bimg = bctx.getImageData(0, 0, 1280, 720); });
  const src = new cv.Mat(720, 1280, cv.CV_8UC4);
  src.data.set(bimg.data);
  const dst = new cv.Mat(720, 1280, cv.CV_8UC4);
  const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [240, 150, 1040, 150, 1040, 570, 240, 570]);
  const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, 1280, 0, 1280, 720, 0, 720]);
  let M;
  time('getPerspectiveTransform', () => { M = cv.getPerspectiveTransform(srcTri, dstTri); });
  time('warpPerspective 1280', () => cv.warpPerspective(src, dst, M, new cv.Size(1280, 720), cv.INTER_LINEAR, cv.BORDER_REPLICATE, new cv.Scalar()));
  const outCanvas = document.createElement('canvas');
  time('imshow 1280', () => cv.imshow(outCanvas, dst));

  time('warp again', () => cv.warpPerspective(src, dst, M, new cv.Size(1280, 720), cv.INTER_LINEAR, cv.BORDER_REPLICATE, new cv.Scalar()));
  time('imshow again', () => cv.imshow(outCanvas, dst));

  log('DONE');
}
</script>
</body></html>
